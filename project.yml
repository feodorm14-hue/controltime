name: ControlTime
options:
  bundleIdPrefix: com.controltime
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  ControlTime:
    type: application
    platform: iOS
    sources:
      - path: Sources/ControlTime
      - path: Sources/Shared
    resources:
      - Sources/ControlTime/Resources/Assets.xcassets
    info:
      path: Sources/ControlTime/Resources/Info.plist
      properties:
        CFBundleDisplayName: ControlTime
        UILaunchScreen: {}
        NSCameraUsageDescription: "ControlTime использует фронтальную камеру для автоматического подсчёта повторений упражнений через определение позы тела."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - controltime
            CFBundleURLName: com.controltime.app
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.controltime.app
        INFOPLIST_KEY_UILaunchScreen_Generation: true

schemes:
  ControlTime:
    build:
      targets:
        ControlTime: all
    run:
      config: Debug
    archive:
      config: Release
